version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: nassayem-postgres
    restart: always
    environment:
      POSTGRES_DB: nassayem_db
      POSTGRES_USER: nassayem_user
      POSTGRES_PASSWORD: nassayem_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nassayem_user -d nassayem_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nassayem-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nassayem.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
